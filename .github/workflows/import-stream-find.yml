name: Import Stream Find source
on:
  push:
    paths:
      - Stream-Find-source-2026-10-02.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand reviewed source archive
        run: |
          echo '38e17768a3b2ee4c9b27e6435bf8da4d524ec128ab539f6c623add8051d451cc  Stream-Find-source-2026-10-02.zip' | sha256sum -c -
          unzip -q Stream-Find-source-2026-10-02.zip
          rm -rf StreamScout-Firebase-Deployment
          rm Stream-Find-source-2026-10-02.zip
          rm .github/workflows/import-stream-find.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish current Stream Find app source'
          git push origin HEAD:main
